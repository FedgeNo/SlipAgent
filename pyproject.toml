[project]
name = "slipagent"
version = "0.1.0"
description = "An agentic coding harness that drives OpenRouter models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0.52,<4",
    "wcwidth>=0.9,<1",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "types-tabulate>=0.9,<1",
    "pyte>=0.8.2,<1",
]

[project.scripts]
slipagent = "slipagent.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slipagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test-*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
packages = ["slipagent"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
