[project]
name = "slipagent"
version = "0.2.36"
description = "An agentic coding harness with selectable completion API providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0.52,<4",
    "Pygments>=2.21,<3",
    "markdown-it-py>=3,<5",
    "wcwidth>=0.9,<1",
    "tabulate>=0.9,<1",
    "tree-sitter-language-pack>=0.13,<1",
    "usearch>=2.16,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
    "huggingface-hub>=2.2,<3",
    "numpy>=1.26,<3",
    "psutil>=5.9,<8",
    "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6,<4",
    "mypy>=1.11",
    "types-tabulate>=0.9,<1",
    "types-Pygments>=2.19,<3",
    "pyte>=0.8.2,<1",
]

[project.scripts]
slipagent = "slipagent.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slipagent"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "slipagent/prompts"
"logo.png" = "slipagent/logo.png"

[tool.hatch.build.targets.sdist]
include = [
    "/src/slipagent",
    "/prompts",
    "/tests",
    "/scripts",
    "/docs",
    "/benchmarks/semantic",
    "/README.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/install.py",
    "/.gitignore",
    "/.env.example",
    "/file-hashes.json",
    "/logo.png",
]

[tool.pytest.ini_options]
addopts = "-n auto --maxprocesses=4 --dist=worksteal"
testpaths = ["tests"]
python_files = ["test_*.py", "test-*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
packages = ["slipagent"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["onnxruntime", "psutil", "usearch.*"]
ignore_missing_imports = true
